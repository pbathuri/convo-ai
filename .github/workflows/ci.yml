name: CI

on:
  push:
    branches: [main, commercial-v1, "auto/**"]
  pull_request:
    branches: [main, commercial-v1]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conversate/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: conversate/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conversate/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: conversate/web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
      - run: npm run test:e2e
        env:
          CI: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: ruff check app tests
